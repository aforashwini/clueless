<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f8"/><stop offset="1" stop-color="#dfe3ec"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb6f2"/><stop offset="1" stop-color="#cdeeff"/></linearGradient>
    <pattern id="carpet" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#3b4f86"/><circle cx="15" cy="15" r="3" fill="#5b70a8"/></pattern>
    <g id="window"><rect x="-32" y="-48" width="64" height="96" rx="30" fill="#c9cfdc"/><rect x="-24" y="-40" width="48" height="80" rx="23" fill="url(#sky)"/><ellipse cx="-4" cy="-6" rx="16" ry="6" fill="#fff"/><ellipse cx="8" cy="14" rx="10" ry="4" fill="#fff"/></g>
    <g id="seat"><rect x="-55" y="0" width="110" height="200" rx="26" fill="#ff4fa3"/><rect x="-46" y="-30" width="92" height="50" rx="16" fill="#ff8cc3"/><rect x="-46" y="-30" width="92" height="20" rx="10" fill="#fff" opacity=".85"/><rect x="-55" y="150" width="110" height="60" rx="14" fill="#d6267d"/></g>
  </defs>
  <rect width="600" height="800" fill="url(#cabin)"/>
  <!-- overhead bins -->
  <path d="M0 40 H600 V150 Q300 190 0 150Z" fill="#fff"/>
  <path d="M0 150 Q300 190 600 150" stroke="#c9cfdc" stroke-width="4" fill="none"/>
  <g stroke="#d9dde7" stroke-width="3"><path d="M150 50 V160 M300 50 V170 M450 50 V160"/></g>
  <g fill="#ffd84a"><circle cx="80" cy="185" r="5"/><circle cx="520" cy="185" r="5"/></g>
  <!-- windows -->
  <use href="#window" x="70" y="320"/><use href="#window" x="530" y="320"/>
  <!-- seats -->
  <use href="#seat" x="70" y="470"/><use href="#seat" x="530" y="470"/>
  <use href="#seat" x="-30" y="520"/><use href="#seat" x="630" y="520"/>
  <!-- aisle -->
  <path d="M0 640 H600 V800 H0Z" fill="#c4cada" opacity=".5"/>
  <path d="M180 800 L250 640 H350 L420 800Z" fill="url(#carpet)"/>
  <g fill="#7dffb5"><circle cx="232" cy="690" r="3"/><circle cx="218" cy="730" r="3"/><circle cx="204" cy="770" r="3"/><circle cx="368" cy="690" r="3"/><circle cx="382" cy="730" r="3"/><circle cx="396" cy="770" r="3"/></g>
  <!-- seatbelt sign -->
  <rect x="270" y="196" width="60" height="26" rx="6" fill="#2b2f3a"/><text x="300" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffd84a">✈</text>
</svg>
