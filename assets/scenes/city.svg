<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8b"/><stop offset=".55" stop-color="#ffc6a5"/><stop offset="1" stop-color="#ffe7c7"/></linearGradient>
    <pattern id="win" width="22" height="28" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="11" height="14" fill="#fff6c9" opacity=".85"/></pattern>
    <pattern id="win2" width="22" height="28" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="11" height="14" fill="#cfe6ff" opacity=".7"/></pattern>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <circle cx="300" cy="300" r="70" fill="#fff0c2" opacity=".8"/>
  <!-- far skyline -->
  <g fill="#c98aa8" opacity=".7">
    <rect x="0" y="300" width="70" height="320"/><rect x="60" y="250" width="50" height="370"/><rect x="120" y="320" width="80" height="300"/>
    <rect x="380" y="280" width="60" height="340"/><path d="M450 330 h70 v290 h-70z"/><rect x="530" y="230" width="70" height="390"/>
    <rect x="248" y="200" width="20" height="60"/><rect x="230" y="260" width="56" height="360"/>
  </g>
  <!-- near buildings -->
  <rect x="-10" y="380" width="150" height="300" fill="#6c4a8f"/><rect x="-10" y="380" width="150" height="300" fill="url(#win)"/>
  <rect x="140" y="440" width="60" height="240" fill="#8d5fa8"/><rect x="140" y="440" width="60" height="240" fill="url(#win2)"/>
  <rect x="440" y="360" width="170" height="320" fill="#5a3f80"/><rect x="440" y="360" width="170" height="320" fill="url(#win)"/>
  <rect x="400" y="460" width="50" height="220" fill="#8d5fa8"/><rect x="400" y="460" width="50" height="220" fill="url(#win2)"/>
  <!-- awning shop -->
  <rect x="455" y="560" width="140" height="120" fill="#2d2147"/>
  <path d="M450 560 h150 v30 h-150z" fill="#ff4fa3"/>
  <path d="M450 590 q12 14 25 0 q12 14 25 0 q12 14 25 0 q12 14 25 0 q12 14 25 0 q12 14 25 0" fill="#ff4fa3"/>
  <path d="M475 560 v30 M525 560 v30 M575 560 v30" stroke="#fff" stroke-width="12"/>
  <!-- street lamp -->
  <rect x="90" y="470" width="8" height="220" fill="#2d2147"/><circle cx="94" cy="466" r="14" fill="#fff6c9" stroke="#2d2147" stroke-width="5"/>
  <!-- sidewalk -->
  <rect y="680" width="600" height="120" fill="#cfc4d8"/>
  <g stroke="#b2a6bf" stroke-width="4"><path d="M0 720 H600"/><path d="M100 680 L80 800 M260 680 L250 800 M420 680 L430 800 M560 680 L590 800"/></g>
  <rect y="676" width="600" height="8" fill="#9f92b0"/>
</svg>
