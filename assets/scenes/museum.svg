<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe6"/><stop offset="1" stop-color="#e8dfd0"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="wood" width="120" height="24" patternUnits="userSpaceOnUse"><rect width="120" height="24" fill="#c99c6b"/><rect width="120" height="2" fill="#a97e52"/><rect x="60" y="0" width="2" height="24" fill="#a97e52"/></pattern>
  </defs>
  <rect width="600" height="800" fill="url(#wall)"/>
  <rect y="0" width="600" height="40" fill="#e1d6c3"/>
  <!-- left painting: sunset abstract -->
  <ellipse cx="90" cy="170" rx="90" ry="80" fill="url(#light)"/>
  <rect x="20" y="180" width="140" height="180" fill="#c9a24a"/>
  <rect x="32" y="192" width="116" height="156" fill="#2b4c7e"/>
  <circle cx="90" cy="250" r="30" fill="#ffb347"/><path d="M32 300 q40 -30 116 0 v48 h-116z" fill="#1a8f7a"/>
  <!-- right painting: water lilies vibe -->
  <ellipse cx="510" cy="170" rx="90" ry="80" fill="url(#light)"/>
  <rect x="440" y="180" width="140" height="180" fill="#c9a24a"/>
  <rect x="452" y="192" width="116" height="156" fill="#8cc7c7"/>
  <g fill="#5fae7f"><ellipse cx="480" cy="240" rx="18" ry="7"/><ellipse cx="530" cy="280" rx="22" ry="8"/><ellipse cx="490" cy="320" rx="20" ry="7"/></g>
  <g fill="#f7a8c8"><circle cx="482" cy="236" r="5"/><circle cx="532" cy="276" r="5"/></g>
  <!-- center tall frame behind the model -->
  <ellipse cx="300" cy="100" rx="120" ry="80" fill="url(#light)"/>
  <rect x="215" y="110" width="170" height="210" fill="#c9a24a"/>
  <rect x="227" y="122" width="146" height="186" fill="#f3d9e4"/>
  <g fill="#ff4fa3" opacity=".7"><circle cx="270" cy="170" r="22"/><rect x="300" y="200" width="50" height="50"/><path d="M240 290 l40 -60 l40 60z" fill="#ffd84a"/></g>
  <!-- placards -->
  <rect x="70" y="375" width="40" height="14" fill="#fff" stroke="#c7b9a3"/><rect x="490" y="375" width="40" height="14" fill="#fff" stroke="#c7b9a3"/>
  <!-- rope barrier -->
  <g fill="#c9a24a"><rect x="40" y="520" width="10" height="150"/><rect x="550" y="520" width="10" height="150"/><circle cx="45" cy="518" r="12"/><circle cx="555" cy="518" r="12"/></g>
  <path d="M50 530 Q150 590 210 545 M390 545 Q450 590 550 530" stroke="#b3123f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- baseboard + floor -->
  <rect y="650" width="600" height="20" fill="#d4c6ae"/>
  <rect y="670" width="600" height="130" fill="url(#wood)"/>
</svg>
